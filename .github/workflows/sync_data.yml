name: Automated Battle Data Sync (PokéCham DB)

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动定时唤醒执行
    - cron: '0 20 * * *'
  workflow_dispatch:
    # 支持在 GitHub 仓库 Actions 页面手动点击一键触发
    inputs:
      force:
        description: '是否强制全量重新抓取 (忽略本地缓存与时间戳对比)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'sync-battle-data'
  cancel-in-progress: true

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装运行依赖与 Playwright 无头浏览器
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: 执行云端赛季嗅探与数据同步管线
        id: run_sync
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/ci_sync.py $FORCE_FLAG

      - name: 检测数据变更并自动提交推送
        if: steps.run_sync.outputs.data_updated == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ cache/
          git commit -m "chore(data): auto-sync season ${{ steps.run_sync.outputs.season }} live battle data [skip ci]"
          git push

      - name: 打印运行报告
        run: |
          echo "=========================================="
          echo "🎉 云端同步检查完成！"
          echo "活跃赛季: ${{ steps.run_sync.outputs.season }}"
          echo "是否有新数据更新并推送: ${{ steps.run_sync.outputs.data_updated }}"
          echo "=========================================="
